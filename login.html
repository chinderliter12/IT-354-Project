<!DOCTYPE html>
<html lang="en" ng-app="myBigApp">
    <head>
        <title>Learning Center Hours</title>
        <link href="content/css/styles.css" rel="stylesheet" type="text/css" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="app/lib/angular.min.js"></script>
        <script src="app/app.js"></script>
    </head>
    <header ng-include="'guestHeader.html'"></header>

    <body class="text-center" ng-controller="handleEvents">
        <div class="align-items-center justify-content-center" style="min-height: 400px; border: 2px solid gray; border-radius: 8px; padding: 40px;">
            <label for="email">
            Email:<br>
            <input 
                id="email" 
                type="text" 
                placeholder="JohnSmith123" 
                class="form-control"
            />
            </label><br><br>
            <label for="password">
                Password:<br>
            <input 
                id="password" 
                type="text" 
                placeholder="Password123!"
                class="form-control"
            />
            <br><br>
            <button 
                class="w-100 btn btn-secondary btn-md"
                ng-click="loginUser(email, password)">
                Sign In
            </button>
        </div>
    </body>
</html>
