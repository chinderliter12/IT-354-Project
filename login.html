<!DOCTYPE html>
<html lang="en" ng-app="myBigApp">
<head>
    <meta charset="UTF-8">
    <title>Learning Center Login</title>
    <link href="content/css/styles.css" rel="stylesheet" type="text/css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="app/lib/angular.min.js"></script>
    <script src="app/app.js"></script>
</head>

<body class="text-center" ng-controller="handleEvents">
    <header ng-include="'guestHeader.html'"></header>

    <div class="container" style="max-width: 400px; margin-top: 100px; border: 2px solid gray; border-radius: 8px; padding: 40px;">
        <h3>Login</h3>
        <form ng-submit="loginUser()">
            <div class="mb-3">
                <label for="email">Email:</label>
                <input 
                    type="email" 
                    id="email" 
                    class="form-control" 
                    placeholder="johnsmith@ilstu.edu"
                    ng-model="loginData.email"
                    required
                >
            </div>

            <div class="mb-3">
                <label for="password">Password:</label>
                <input 
                    type="password" 
                    id="password" 
                    class="form-control" 
                    placeholder="Password123!" 
                    ng-model="loginData.password"
                    required
                >
            </div>

            <button type="submit" class="btn btn-secondary w-100">Sign In</button>
        </form>
    </div>
</body>
</html>
