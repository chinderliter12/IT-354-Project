<!DOCTYPE html>
<html lang="en" ng-app="myBigApp">
    <head>
        <title>Learning Center Hours</title>
        <link href="content/css/styles.css" rel="stylesheet" type="text/css" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="app/lib/angular.min.js"></script>
        <script src="app/app.js"></script>
    </head>
    
    <body class="text-center" ng-controller="handleEvents">
        <header ng-include="'guestHeader.html'"></header>
        <div class="d-flex justify-content-center align-items-center">
            <div style="min-height: 400px; width: 600px; border: 2px solid gray; border-radius: 8px; padding: 40px;">
            <label for="email">
            Email:<br>
            <input 
                id="email" 
                type="text" 
                placeholder="JohnSmith123" 
                class="form-control"
                ng-model="email"
            />
            </label><br><br>
            <label for="password">
                Password:<br>
            <input 
                id="password" 
                type="password" 
                placeholder="Password123!"
                class="form-control"
                ng-model="password"
            />
            <br>
            <select class="form-select" aria-label="Role selector for testing">
                <option selected:>Select a role</option>
                <option value="0">Guest</option>
                <option value="1">Student</option>
                <option value="2">Tutor</option>
                <option value="3">Admin</option>
            </select>
            <br>
            <button 
                class="w-100 btn btn-secondary btn-md"
                ng-click="loginUser(email, password)">
                <a href="homePage.html" class="link-body-emphasis text-decoration-none" style="color: white;">Sign In</a>
            </button>
            
        </div>
        </div>
    </body>
</html>
