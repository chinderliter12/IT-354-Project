<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>IT Learning Center Demo</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    input, button { margin: 5px 0; display: block; }
    .section { margin-bottom: 30px; border-bottom: 1px solid #ccc; padding-bottom: 20px; }
    pre { background: #f4f4f4; padding: 10px; }
  </style>
</head>
<body>
  <h1>IT Learning Center Backend Demo</h1>

  <div class="section">
    <h2>1️⃣ Register User</h2>
    <input type="text" id="regName" placeholder="Name" value="Demo User">
    <input type="text" id="regUsername" placeholder="Username" value="demouser">
    <input type="email" id="regEmail" placeholder="Email" value="demo@example.com">
    <input type="password" id="regPassword" placeholder="Password" value="123456">
    <button onclick="registerUser()">Register</button>
    <pre id="registerResult"></pre>
  </div>

  <div class="section">
    <h2>2️⃣ Login User</h2>
    <input type="email" id="loginEmail" placeholder="Email" value="demo@example.com">
    <input type="password" id="loginPassword" placeholder="Password" value="123456">
    <button onclick="loginUser()">Login</button>
    <pre id="loginResult"></pre>
  </div>

  <div class="section">
    <h2>3️⃣ Create Booking</h2>
    <input type="date" id="bookingDate" value="2026-03-18">
    <input type="time" id="bookingTime" value="14:00">
    <input type="text" id="bookingDesc" placeholder="Description" value="Demo booking session">
    <button onclick="createBooking()">Create Booking</button>
    <pre id="bookingResult"></pre>
  </div>

  <div class="section">
    <h2>4️⃣ Get All Bookings</h2>
    <button onclick="getBookings()">View Bookings</button>
    <pre id="allBookings"></pre>
  </div>

  <script>
    const API_URL = "http://localhost:5000/api"; // change if needed
    let jwtToken = "";
    let userId = "";

    async function registerUser() {
      const name = document.getElementById('regName').value;
      const username = document.getElementById('regUsername').value;
      const email = document.getElementById('regEmail').value;
      const password = document.getElementById('regPassword').value;

      const res = await fetch(`${API_URL}/auth/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, username, email, password })
      });
      const data = await res.json();
      userId = data._id || "";
      document.getElementById('registerResult').textContent = JSON.stringify(data, null, 2);
    }

    async function loginUser() {
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;

      const res = await fetch(`${API_URL}/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      jwtToken = data.token || "";
      document.getElementById('loginResult').textContent = JSON.stringify(data, null, 2);
    }

    async function createBooking() {
      const date = document.getElementById('bookingDate').value;
      const time = document.getElementById('bookingTime').value;
      const description = document.getElementById('bookingDesc').value;

      if (!jwtToken || !userId) {
        alert("Please login first!");
        return;
      }

      const res = await fetch(`${API_URL}/booking`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${jwtToken}`
        },
        body: JSON.stringify({ userId, date, time, description })
      });
      const data = await res.json();
      document.getElementById('bookingResult').textContent = JSON.stringify(data, null, 2);
    }

    async function getBookings() {
      if (!jwtToken) {
        alert("Please login first!");
        return;
      }

      const res = await fetch(`${API_URL}/booking`, {
        method: 'GET',
        headers: { 'Authorization': `Bearer ${jwtToken}` }
      });
      const data = await res.json();
      document.getElementById('allBookings').textContent = JSON.stringify(data, null, 2);
    }

<input type="time" id="bookingStart" value="14:00" placeholder="Start Time">
<input type="time" id="bookingEnd" value="15:00" placeholder="End Time">

  </script>
</body>
</html>
