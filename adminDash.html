<!DOCTYPE html>
<html lang="en" ng-app="myBigApp">
    <head>
        <title>Admin Dashboard</title>
        <link href="content/css/styles.css" rel="stylesheet" type="text/css" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="app\lib\angular.min.js"></script>
        <script src="app\app.js"></script>
        <script src="app/adminHelper.js"></script>
    </head>
    <body>
        <header ng-include="'adminHeader.html'"></header>
        <div>This is the adminDash.html page.</div><br>
        <div>
            All appointments:
        </div><br>
        <div>
            View tutors and students:
        </div><br>
        <div>
            Assign tutor hours:<br>
            Select a tutor:
                <div class="dropdown">
                    <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                        Dropdown button
                    </button>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="#">Action</a></li>
                        <li><a class="dropdown-item" href="#">Another action</a></li>
                        <li><a class="dropdown-item" href="#">Something else here</a></li>
                    </ul>
                </div>
            Select a start time:
                <input 
                    type="datetime-local" 
                    id="singleTutorStart"
                /><br>
            Select an end time:
                <input 
                    type="datetime-local"
                    id="singleTutorEnd"
                /><br>
                <input type="submit">
            Selected end time: {{ endTime }}
        </div><br>
        <div>
            Change tutoring hours for all:
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
