<!DOCTYPE html>
<html lang="en" ng-app="myBigApp">

<head>
    <title>Admin Dashboard</title>

    <link href="content/css/styles.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="app/lib/angular.min.js"></script>
    <script src="app/app.js"></script>
</head>

<body>

    <header ng-include="'adminHeader.html'"></header>

    <div style="margin: 40px;" ng-controller="handleEvents">

        <ul class="list-group">

            <!-- USERS SECTION -->
            <li class="list-group-item">
                <h5>Users (Students & Tutors)</h5>

                <table class="table">
                    <thead>
                        <tr>
                            <th>Role</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Active</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr ng-repeat="user in users">
                            <td>{{user.role}}</td>
                            <td>{{user.name}}</td>
                            <td>{{user.email}}</td>
                            <td>
                                <input type="checkbox" ng-model="user.active">
                            </td>
                        </tr>
                    </tbody>
                </table>
            </li>

            <!-- TUTOR SCHEDULING -->
            <li class="list-group-item">
                <h5>Assign Tutor Hours</h5>

                <select class="form-select" style="width: 250px;"
                        ng-model="selectedTutor"
                        ng-options="t.name for t in tutors">
                    <option value="">Select a tutor</option>
                </select>

                <br>

                <label>Date:</label>
                <input type="date" class="form-control" ng-model="schedule.date">

                <label>Start Time:</label>
                <input type="time" class="form-control" ng-model="schedule.startTime">

                <label>End Time:</label>
                <input type="time" class="form-control" ng-model="schedule.endTime">

                <br>

                <button class="btn btn-primary">
                    Save Schedule
                </button>
            </li>

            <!-- GLOBAL HOURS -->
            <li class="list-group-item">
                <h5>Change Hours for All Tutors</h5>

                <label>Date:</label>
                <input type="date" class="form-control">

                <label>Start Time:</label>
                <input type="time" class="form-control">

                <label>End Time:</label>
                <input type="time" class="form-control">

                <br>

                <button class="btn btn-warning">
                    Apply to All
                </button>
            </li>

            <!-- BOOKINGS -->
            <li class="list-group-item">
                <h5>All Bookings</h5>

                <table class="table">
                    <thead>
                        <tr>
                            <th>Student</th>
                            <th>Tutor</th>
                            <th>Date</th>
                            <th>Time</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr ng-repeat="b in bookings">
                            <td>{{b.studentId}}</td>
                            <td>{{b.tutorId}}</td>
                            <td>{{b.date}}</td>
                            <td>{{b.startTime}} - {{b.endTime}}</td>
                        </tr>
                    </tbody>
                </table>

            </li>

        </ul>
    </div>

</body>
</html>
