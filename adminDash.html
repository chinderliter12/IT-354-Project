<!DOCTYPE html>
<html lang="en" ng-app="myBigApp">
    <head>
        <title>Admin Dashboard</title>
        <link href="content/css/styles.css" rel="stylesheet" type="text/css" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="app\lib\angular.min.js"></script>
        <script src="app\app.js"></script>
        <script src="app/adminHelper.js"></script>
    </head>
    <body>
        <header ng-include="'adminHeader.html'"></header>
        <div>This is the adminDash.html page.</div><br>
        <ul class="list-group">
            <li class="list-group-item">
                <div>
                    All appointments:
                </div>
            </li>
            <li class="list-group-item">
                <div>
                    View tutors and students:
                </div>
            </li>
            <li class="list-group-item">
                <div>
                    Assign tutor hours:
                        <div class="dropdown">
                            <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                                Select a tutor
                            </button>
                            <ul class="dropdown-menu">
                                <li><a class="dropdown-item" href="#">Tutor 1</a></li>
                                <li><a class="dropdown-item" href="#">Tutor 2</a></li>
                                <li><a class="dropdown-item" href="#">Tutor 3</a></li>
                            </ul>
                        </div>
                        <label for="singleTutorDate">Date Affected:</label>
                        <input type="date" id="changedDate" name="changedDate">
                        Select a start time:
                        
                        <input 
                            type="datetime-local" 
                            id="singleTutorStart"
                        /><br>
                        Select an end time:
                        <input 
                            type="datetime-local"
                            id="singleTutorEnd"
                        /><br>
                        <input type="submit">
                </div>
            </li>
            <li class="list-group-item">
                <div>
                    Change tutoring hours for all:
                </div>
            </li>
        </ul>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
