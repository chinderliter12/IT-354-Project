<!DOCTYPE html>
<html lang="en" ng-app="myBigApp">

<head>
    <title>IT Learning Center Hours</title>

    <link href="content/css/styles.css" rel="stylesheet" type="text/css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="app/lib/angular.min.js"></script>
    <script src="app/app.js"></script>
</head>

<body ng-controller="handleEvents">

    <!-- FIXED HEADER -->
    <header ng-include="'guestHeader.html'"></header>

    <div style="margin: 40px;">

        <h4 style="margin-bottom: 40px;">Tutoring sessions by course:</h4>

        <ul class="list-group">

            <!-- REAL COURSES FROM BACKEND -->
            <li ng-repeat="course in courses" style="margin-bottom: 20px;">

                <div class="card">

                    <div class="card-header">
                        {{ course.name }}
                    </div>

                    <div class="card-body">

                        <p class="card-text">
                            {{ course.description }}
                        </p>

                        <!-- SIMPLE PLACEHOLDER TIMES (since backend doesn't store schedule yet) -->
                        <p class="card-text">
                            Start time: 8:00 AM
                        </p>

                        <p class="card-text">
                            End time: 6:00 PM
                        </p>

                        <!-- BOOK BUTTON -->
                        <button class="btn btn-secondary"
                                ng-click="booking.courseId = course._id; goToBooking(course)">
                            Make Appointment
                        </button>

                    </div>

                </div>

            </li>

        </ul>

    </div>

</body>
</html>
