<!DOCTYPE html>
<html lang="en" ng-app="myBigApp">
    <head>
        <title>IT Learning Center Hours</title>
        <link href="content/css/styles.css" rel="stylesheet" type="text/css" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="app/lib/angular.min.js"></script>
        <script src="app/app.js"></script>
    </head>
    <body>
        <header ng-include="'guestHeader.html'"></header>
        <div>This is the hours.html page.</div>
        <h4 style="margin-bottom: 40px;">Course list:</h4>
        <ul class="list-group" style="min-height: 40px;" ng-controller="displayCourses">
            <li ng-repeat="course in exampleCourses | filter: search" ng-show="course.open">
                {{ course.name }} | {{ course.numTutors }}
            </li>
        </ul>
    </body>
</html>
