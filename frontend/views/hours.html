<!DOCTYPE html>
<html lang="en" ng-app="myBigApp">

<head>
    <title>Available Tutoring Hours</title>

    <link href="../assets/css/styles.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="../app/lib/angular.min.js"></script>
    <script src="../app/app.js"></script>
</head>

<body ng-controller="handleEvents">

    <header ng-include="'../subviews/adminHeader.html'"></header>

    <div class="main-container">

        <h3>Available Courses & Hours</h3>

        <div class="container mt-3">

            <div class="card mb-3" ng-repeat="course in courses">

                <div class="card-header">
                    {{ course.name }}
                </div>

                <div class="card-body">

                    <p>{{ course.description }}</p>

                    <button class="btn btn-primary"
                            ng-click="appointment.course = course.name">
                        Select Course
                    </button>

                </div>

            </div>

        </div>

        <hr>

        <h3>Book a Session</h3>

        <div class="container">

            <input class="form-control mb-2"
                   placeholder="Course"
                   ng-model="appointment.course">

            <input class="form-control mb-2"
                   placeholder="Tutor Name"
                   ng-model="appointment.tutor">

            <input class="form-control mb-2"
                   placeholder="Start Time"
                   ng-model="appointment.startTime">

            <input class="form-control mb-2"
                   placeholder="End Time"
                   ng-model="appointment.endTime">

            <button class="btn btn-success w-100"
                    ng-click="bookAppointment()">
                Book Appointment
            </button>

        </div>

    </div>

</body>
</html>
