<!DOCTYPE html>
<html lang="en" ng-app="myBigApp">

<head>
    <title>Database I/O Testing</title>

    <link href="../assets/css/styles.css" rel="stylesheet" type="text/css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="../app/lib/angular.min.js"></script>
    <script src="../app/app.js"></script>
</head>

<body>

    <!-- HEADER -->
    <header ng-include="'../subviews/adminHeader.html'"></header>

    <!-- MAIN APP -->
    <div class="main-container" ng-controller="handleEvents">

        <!-- INPUT FORM -->
        <div class="container justify-content-center mx-auto" style="max-width: 600px;">

            <div class="d-flex flex-column gap-3">

                <input id="name"
                       type="text"
                       placeholder="Course"
                       class="form-control mx-auto"
                       style="max-width: 500px;" />

                <input id="tutor"
                       type="text"
                       placeholder="Tutor Name"
                       class="form-control mx-auto"
                       style="max-width: 500px;" />

                <input id="desc"
                       type="text"
                       placeholder="Description"
                       class="form-control mx-auto"
                       style="max-width: 500px;" />

            </div>

            <!-- SUBMIT BUTTON -->
            <button class="btn btn-secondary btn-md d-block mx-auto mt-3"
                    ng-click="addCourse()">
                Submit
            </button>

        </div>

        <br>

        <!-- COURSES TABLE -->
        <div ng-if="courses.length > 0">

            <h5 class="text-center">Courses:</h5>

            <table class="table table-striped">

                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Tutor</th>
                        <th>Description</th>
                    </tr>
                </thead>

                <tbody>
                    <tr ng-repeat="course in courses">
                        <td>{{ course.name }}</td>
                        <td>{{ course.tutor }}</td>
                        <td>{{ course.description }}</td>
                    </tr>
                </tbody>

            </table>

        </div>

        <!-- EMPTY STATE -->
        <div ng-if="courses.length === 0" class="text-center mt-4">
            <p>No course data is available.</p>
        </div>

    </div>

    <!-- BOOTSTRAP JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
