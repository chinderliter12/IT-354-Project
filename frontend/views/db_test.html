<!DOCTYPE html>
<html lang="en" ng-app="myBigApp">
    <head>
        <title>Database I/O Testing</title>
        <link href="../assets/css/styles.css" rel="stylesheet" type="text/css" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="../app/lib/angular.min.js"></script>
        <script src="../app/app.js"></script>
    </head>
    <body>
        <header ng-include="'../subviews/adminHeader.html'"></header>
        <div class="main-container" ng-controller="handleEvents">
            <div class="container justify-content-center gap-3 mx-auto" style="max-width: 600px;">
                <div class="d-flex flex-column gap-3">
                    <input id="name" type="text" placeholder="Course" class="form-control mx-auto" style="max-width: 500px;"/>
                    <input id="tutor" type="text" placeholder="Tutor Name" class="form-control mx-auto" style="max-width: 500px;"/>
                    <input id="desc" type="text" placeholder="Description" class="form-control mx-auto" style="max-width: 500px;"/>
                </div>
                <!-- This button is intended to submit the previous course info to the db. -->
                <button class="btn btn-secondary btn-md d-block mx-auto mt-3">Submit</button>
            </div><br>
            <div ng-if="courses && courses.length">
                <ul class="list-group">
                    <li class="list-group-item">
                    <div>
                        <h5>Courses:</h5>
                        <table class="table">
                            <thead>
                                <tr>
                                    <th scope="col">Name</th>
                                    <th scope="col">Tutor Name</th>
                                    <th scope="col">Description</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr ng-repeat="course in courses">
                                    <td>{{ course.name }}</td>
                                    <td>{{ course.tutor.name }}</td>
                                    <td>{{ course.description }}</td>
                                </tr>
                            </tbody>
                            </table>
                    </div>
                </li>
                </ul>
            </div>
            <div ng-if="courses && !courses.length">
                <p>No course data is available.</p>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
