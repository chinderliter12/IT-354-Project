<!DOCTYPE html>
<html lang="en" ng-app="myBigApp">
    <head>
        <title>Database I/O Testing</title>
        <link href="../assets/css/styles.css" rel="stylesheet" type="text/css" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="../app/lib/angular.min.js"></script>
        <script src="../app/app.js"></script>
    </head>
    <body>
        <header ng-include="'../subviews/adminHeader.html'"></header>
        <div class="main-container" ng-controller="populateExamples">
            <div class="container justify-content-center gap-3 mx-auto" style="max-width: 600px;">
                <div class="d-flex flex-column gap-3">
                    <input id="name" type="text" placeholder="Name" class="form-control mx-auto" style="max-width: 500px;"/>
                    <input id="number" type="text" placeholder="Number" class="form-control mx-auto" style="max-width: 500px;"/>
                    <input id="email" type="text" placeholder="Email" class="form-control mx-auto" style="max-width: 500px;"/>
                    <input id="password" type="text" placeholder="Password" class="form-control mx-auto" style="max-width: 500px;"/>
                </div>
                <button class="btn btn-secondary btn-md d-block mx-auto mt-3">Submit</button>
            </div><br>
            <div>
                <ul class="list-group">
                    <li class="list-group-item">
                    <div>
                        <h5>Students:</h5>
                        <table class="table">
                            <thead>
                                <tr>
                                    <th scope="col">First</th>
                                    <th scope="col">Last</th>
                                    <th scope="col">Email</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr ng-repeat="student in exampleStudents">
                                    <td>{{ student.fName }}</td>
                                    <td>{{ student.lName }}</td>
                                    <td>{{ student.email }}</td>
                                </tr>
                            </tbody>
                            </table>
                    </div>
                </li>
                </ul>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
