
<!-- Page that is used for all tutor-specific operations -->

<!DOCTYPE html>
<html lang="en" ng-app="myBigApp">

<head>
    <title>Tutor Dashboard</title>
    <link href="../assets/css/styles.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="../app/lib/angular.min.js"></script>
    <script src="../app/app.js"></script>
</head>

<body ng-controller="handleEvents">

<header ng-include="headerString"></header>

<div class="container mt-4">

    <h2>Tutor Dashboard</h2>

    <!-- Shouldn't we just call this on page load? -->
    <button class="btn btn-primary mb-3"
            ng-click="getTutorAppointments()">
        Load My Appointments
    </button>

    <table class="table table-striped">

        <tr>
            <th>Student</th>
            <th>Course</th>
            <th>Status</th>
            <th>Comment</th>
            <th>Actions</th>
        </tr>
        <tr ng-repeat="a in tutorAppointments">
            <td>{{a.student.name}}</td>
            <td>{{a.course}}</td>
            <td>{{a.status}}</td>
            <td>
                <input type="text" ng-model="a.newComment" class="form-control">
            </td>
            <td>
                <button class="btn btn-success btn-sm"
                        ng-click="addComment(a._id, a.newComment)">
                    Add Comment
                </button>
                <button class="btn btn-danger btn-sm"
                        ng-click="markNoShow(a._id)">
                    No Show
                </button>
            </td>

        </tr>

    </table>

</div>

</body>
</html>
