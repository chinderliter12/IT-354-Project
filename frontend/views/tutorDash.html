<!DOCTYPE html>
<html lang="en" ng-app="myBigApp">

<head>
    <title>Tutor Dashboard</title>
    <link href="../assets/css/styles.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="../app/lib/angular.min.js"></script>
    <script src="../app/app.js"></script>
</head>

<body ng-controller="tutorFunctions">
    <div ng-controller="loginFunctions">
        <header ng-include="headerString"></header>
    </div>
    <div class="container mt-4">
        <h2>Tutor Dashboard</h2>
        <table class="table table-striped">
            <tr>
                <th>Student</th>
                <th>Course</th>
                <th>Date</th>
                <th>Time</th>
                <th>Status</th>
                <th>Comment</th>
                <th>Actions</th>
            </tr>

            <tr ng-repeat="a in tutorAppointments">
                <td>{{a.student.name || a.student.email || a.student}}</td>
                <td>{{a.course}}</td>
                <td>{{a.date}}</td>
                <td>{{a.startTime}} - {{a.endTime}}</td>
                <td>{{a.status}}</td>
                <td>
                    <input type="text"
                        ng-model="a.newComment"
                        class="form-control">
                </td>
                <td>
                    <button class="btn btn-success btn-sm" ng-click="addComment(a._id, a.newComment)">Add Comment</button>
                    <button class="btn btn-danger btn-sm" ng-click="markNoShow(a._id)">No Show</button>
                    <button class="btn btn-warning btn-sm"
                            ng-click="cancelAsTutor(a._id)">
                        Cancel
                    </button>
                </td>
            </tr>
        </table>
    </div>
</body>
</html>
