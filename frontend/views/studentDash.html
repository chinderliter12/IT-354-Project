<!-- Student Dashboard -->

<!DOCTYPE html>
<html lang="en" ng-app="myBigApp">

<head>
    <title>Student Dashboard</title>
    <link href="../assets/css/styles.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="../app/lib/angular.min.js"></script>
    <script src="../app/app.js"></script>
</head>

<body ng-controller="handleEvents">
    <header ng-include="headerString"></header>
    <div class="container mt-4">
        <h2>Student Dashboard</h2>
        <button class="btn btn-primary mb-3"
                ng-click="getMyAppointments()">
            Refresh My Appointments
        </button>

        <table class="table table-striped">
            <tr>
                <th>Tutor</th>
                <th>Course</th>
                <th>Date</th>
                <th>Time</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>

            <tr ng-repeat="a in appointments">
                <td>{{a.tutor.name || a.tutor.email || a.tutor}}</td>
                <td>{{a.course}}</td>
                <td>{{a.date | date:'shortDate'}}</td>
                <td>{{a.startTime}} - {{a.endTime}}</td>
                <td>{{a.status}}</td>
                <td>
                    <button class="btn btn-danger btn-sm"
                            ng-click="cancelAppointment(a._id)">
                        Cancel
                    </button>
                </td>
            </tr>
        </table>
    </div>
</body>
</html>
