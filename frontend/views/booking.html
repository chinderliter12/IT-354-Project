<!-- Student Booking Page -->

<!DOCTYPE html>
<html lang="en" ng-app="myBigApp" ng-controller="handleEvents">

<head>
    <title>Tutoring Sessions</title>

    <link href="../assets/css/styles.css" rel="stylesheet" type="text/css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="../app/lib/angular.min.js"></script>
    <script src="../app/app.js"></script>
</head>

<body>

<div ng-controller="loginFunctions">
    <header ng-include="headerString"></header>
</div>

<div class="main-container" ng-controller="studentFunctions">
    <h4 style="margin-bottom: 40px;">Available Tutoring Sessions:</h4>

    <div class="container px-4" style="margin: 40px;">
        <input ng-model="searchString"
               type="text"
               placeholder="Search a course..."
               class="form-control"/>
    </div>

    <div class="accordion" id="courseAccordion">
        <div class="accordion-item"
             ng-repeat="course in courses | filter:{name:searchString}">

            <h2 class="accordion-header">
                <button class="accordion-button collapsed"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#collapse{{$index}}">
                    {{course.name}}
                </button>
            </h2>

            <div id="collapse{{$index}}"
                 class="accordion-collapse collapse"
                 data-bs-parent="#courseAccordion">

                <div class="accordion-body">
                    <p><strong>Tutor:</strong> {{course.tutor.name}}</p>

                    <input type="date"
                           ng-model="appointment.date"
                           min="{{today}}"
                           max="{{maxDate}}"
                           class="form-control mb-3"
                           ng-change="appointment.slot = null">

                    <select class="form-select"
                            ng-model="appointment.slot"
                            ng-if="appointment.date">

                        <option value="">Choose a timeslot</option>

                        <option ng-repeat="slot in slots"
                                ng-value="slot.value">
                            {{slot.label}}
                        </option>

                    </select>

                    <button class="btn btn-primary mt-3"
                            ng-click="setBooking(course); bookAppointment()">
                        Book Appointment
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
