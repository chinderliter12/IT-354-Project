<!DOCTYPE html>
<html lang="en" ng-app="myBigApp">

<head>
    <title>Sessions - Booking System</title>

    <link href="../assets/css/styles.css" rel="stylesheet" type="text/css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="../app/lib/angular.min.js"></script>
    <script src="../app/app.js"></script>
</head>

<body>

    <header ng-include="'../subviews/adminHeader.html'"></header>

    <div class="container mt-4" ng-controller="handleEvents">

        <div class="card p-4 mb-4">

            <h3 class="mb-3">Book a Tutoring Session</h3>

            <input class="form-control mb-2"
                   placeholder="Course (e.g. IT 179)"
                   ng-model="appointment.course">

            <input class="form-control mb-2"
                   placeholder="Tutor Name"
                   ng-model="appointment.tutor">

            <input class="form-control mb-2"
                   placeholder="Start Time (e.g. 10:00 AM)"
                   ng-model="appointment.startTime">

            <input class="form-control mb-2"
                   placeholder="End Time (e.g. 11:00 AM)"
                   ng-model="appointment.endTime">

            <button class="btn btn-primary w-100"
                    ng-click="bookAppointment()">
                Book Appointment
            </button>

        </div>

        <div class="card p-4">

            <h3 class="mb-3">My Appointments</h3>

            <div ng-if="appointments.length > 0">

                <table class="table table-striped">

                    <thead>
                        <tr>
                            <th>Course</th>
                            <th>Tutor</th>
                            <th>Start</th>
                            <th>End</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr ng-repeat="a in appointments">

                            <td>{{ a.course }}</td>
                            <td>{{ a.tutor }}</td>
                            <td>{{ a.startTime }}</td>
                            <td>{{ a.endTime }}</td>
                            <td>{{ a.status }}</td>

                            <td>
                                <button class="btn btn-danger btn-sm"
                                        ng-click="cancelAppointment(a._id)">
                                    Cancel
                                </button>
                            </td>

                        </tr>
                    </tbody>

                </table>

            </div>

            <div ng-if="appointments.length === 0">
                <p class="text-muted">No appointments found.</p>
            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
