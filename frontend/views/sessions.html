<!DOCTYPE html>
<html lang="en" ng-app="myBigApp">

<head>
    <title>IT Learning Center Sessions</title>
        <link href="../assets/css/styles.css" rel="stylesheet" type="text/css" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="../app/lib/angular.min.js"></script>
        <script src="../app/app.js"></script>
</head>

<body ng-controller="handleEvents">

    <!-- HEADER (guest or switch to admin if needed) -->
    <header ng-include="'guestHeader.html'"></header>

    <div style="margin: 40px;">

        <h3>Your Tutoring Sessions</h3>

        <!-- NOT LOGGED IN -->
        <div ng-if="!isLoggedIn">
            <p>Please <a href="login.html">log in</a> to view your sessions.</p>
        </div>

        <!-- LOGGED IN -->
        <div ng-if="isLoggedIn">

            <div ng-if="!bookings || bookings.length === 0">
                <p>No sessions found.</p>
            </div>

            <table class="table table-striped" ng-if="bookings.length > 0">

                <thead>
                    <tr>
                        <th>Tutor ID</th>
                        <th>Date</th>
                        <th>Start</th>
                        <th>End</th>
                        <th>Description</th>
                    </tr>
                </thead>

                <tbody>
                    <tr ng-repeat="b in bookings">
                        <td>{{b.tutorId}}</td>
                        <td>{{b.date}}</td>
                        <td>{{b.startTime}}</td>
                        <td>{{b.endTime}}</td>
                        <td>{{b.description}}</td>
                    </tr>
                </tbody>

            </table>

        </div>

    </div>

</body>
</html>
