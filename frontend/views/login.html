<!DOCTYPE html>
<html lang="en" ng-app="myBigApp">
<head>
    <title>Learning Center Login</title>
    <link href="../assets/css/styles.css" rel="stylesheet" type="text/css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="../app/lib/angular.min.js"></script>
    <script src="../app/app.js"></script>
</head>

<body class="text-center" ng-controller="handleEvents">
    <header ng-include="'../subviews/guestHeader.html'"></header>

    <div class="d-flex justify-content-center align-items-center">
        <div style="min-height: 400px; width: 600px; border: 2px solid gray; border-radius: 8px; padding: 40px;">

            <!-- Login Form -->
            <form ng-submit="loginUser()">
                <h2>Login</h2>
                <div class="mb-3">
                    <label for="email">Email:</label>
                    <input 
                        type="email" 
                        id="email" 
                        class="form-control" 
                        placeholder="admin@example.com"
                        ng-model="loginData.email"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="password">Password:</label>
                    <input 
                        type="password" 
                        id="password" 
                        class="form-control" 
                        placeholder="Admin123!" 
                        ng-model="loginData.password"
                        required
                    >
                </div>

                <button type="submit" class="btn btn-secondary w-100">Sign In</button>
            </form>

            <!-- Optional: show login status -->
            <div class="mt-3" ng-if="loginMessage">
                <div class="alert" ng-class="{'alert-success': loginSuccess, 'alert-danger': !loginSuccess}">
                    {{loginMessage}}
                </div>
            </div>

        </div>
    </div>
</body>
</html>
