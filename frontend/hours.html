<!DOCTYPE html>
<html lang="en" ng-app="myExamples">
    <head>
        <title>IT Learning Center Hours</title>
        <link href="content/css/styles.css" rel="stylesheet" type="text/css" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="app/lib/angular.min.js"></script>
        <script src="app/app.js"></script>
        <script src="app/examples.js"></script>
    </head>
    <body>
        <header ng-include="'adminHeader.html'"></header>
        <div style="margin: 40px;">
            <h4 style="margin-bottom: 40px;">Tutoring sessions by course:</h4>
                <ul class="list-group" style="min-height: 40px;" ng-controller="populateExamples">
                    <li ng-repeat="course in exampleCourses">
                        <div class="card">
                            <div class="card-header">
                                {{ course.title }}
                            </div>
                            <div class="card-body">
                                <p class="card-text">Start time: {{ course.startTime }}</p>
                                <p class="card-text">End time: {{ course.endTime }}</p>
                                <a href="#" class="btn btn-secondary">Make Appointment</a>
                            </div>
                        </div>
                    </li>
                </ul>
        </div>
    </body>
</html>
